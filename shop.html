<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop · Jasam Global Trading LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop products from Jasam Global Trading LLC." />
  <style>
    :root {
      --navy: #0f2a44;
      --blue: #1f4fd8;
      --slate: #475569;
      --light: #f8fafc;
      --border: #e5e7eb;
      --card: #ffffff;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--light);
      color: #1f2937;
      line-height: 1.6;
    }
    nav { background: #0b1f33; color: white; }
    .nav-inner {
      max-width: 1000px; margin: 0 auto; padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    }
    .nav-inner a { color: #dbeafe; }
    header { background: linear-gradient(135deg, var(--navy), #123a63); color: white; }
    .header-inner { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: 0.3px; }
    .tagline { margin-top: 8px; font-size: 15px; color: #dbeafe; }
    .container { max-width: 1000px; margin: 0 auto; padding: 48px 20px; }
    h2 { font-size: 22px; margin-bottom: 18px; color: var(--navy); }
    p { font-size: 15px; color: var(--slate); margin-bottom: 12px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 22px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; flex-direction: column;
    }
    .card.unavailable { opacity: 0.55; }
    .card h3 { font-size: 16px; margin: 0 0 8px; color: var(--navy); line-height: 1.35; min-height: 44px; }
    .price { font-size: 20px; font-weight: 700; color: var(--navy); margin: 4px 0 14px; }
    .stock { font-size: 13px; color: var(--slate); margin-bottom: 14px; }
    .buy {
      background: var(--blue); color: white; border: none; padding: 11px 20px;
      font-size: 14px; border-radius: 6px; cursor: pointer; text-align: center;
      text-decoration: none; display: inline-block; margin-top: auto;
    }
    .buy:hover { background: #1d4ed8; }
    .buy.disabled {
      background: #cbd5e1; color: #64748b; cursor: not-allowed; pointer-events: none;
    }
    footer { background: #0b1f33; color: #cbd5e1; text-align: center; padding: 28px 20px; font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <strong>Jasam Global Trading LLC</strong>
    <span><a href="index.html">Home</a> &nbsp;·&nbsp; Wholesale Import &amp; Export</span>
  </div>
</nav>

<header>
  <div class="header-inner">
    <h1>Shop</h1>
    <div class="tagline">Buy directly from Jasam Global Trading LLC</div>
  </div>
</header>

<main class="container">
  <section>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>© Jasam Global Trading LLC · United States</footer>

<script>
// Each product needs a Stripe Payment Link URL in "buy". Replace the null
// placeholders once the links are created in the Stripe Dashboard — see setup steps.
const PRODUCTS = [
  {t:"ONN Android TV 2K FHD Streaming Stick", p:41.99, stock:10, buy:null},
  {t:"Wiggles & Wags Twists Dog Treats, Chicken & Sweet Potato, 16 oz", p:22.00, stock:1, buy:null},
  {t:"Wiggles & Wags Twists Dog Treats, Beef & Sweet Potato, 16 oz", p:21.75, stock:1, buy:null},
  {t:"Stafford 4 Pack Cotton V-Neck T-Shirts, Big & Tall, White", p:56.99, stock:4, buy:null},
  {t:"MARS MEN Testosterone Booster Supplement, 30 Servings", p:65.00, stock:3, buy:null},
  {t:"GAP Women's Favorite Crewneck Tee, True Black, Medium Tall", p:19.84, stock:5, buy:null},
  {t:"GAP Men's Soft Crewneck Tee, Woodsy Brown, Large", p:20.99, stock:8, buy:null},
  {t:"Juicy Fruit Fruity Chews Sugarfree Gum, 120 pc (3 Pack)", p:44.99, stock:3, buy:null},
];

grid.innerHTML = PRODUCTS.map(p => `
  <div class="card ${p.stock<=0?'unavailable':''}">
    <h3>${p.t}</h3>
    <div class="price">$${p.p.toFixed(2)}</div>
    <div class="stock">${p.stock>0 ? p.stock+" in stock" : "Currently unavailable"}</div>
    ${p.stock>0 && p.buy
      ? `<a class="buy" href="${p.buy}">Buy Now</a>`
      : `<span class="buy disabled">${p.stock>0 ? "Buy link coming soon" : "Sold Out"}</span>`}
  </div>
`).join("");
</script>

</body>
</html>
