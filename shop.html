<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop · Jasam Global Trading LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Shop products from Jasam Global Trading LLC." />
  <meta name="theme-color" content="#070707" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #070707;
      --panel: #0f0f0e;
      --panel-2: #151412;
      --gold: #d6ab5c;
      --gold-light: #f2d78f;
      --gold-dark: #8f6a25;
      --text: #e8e1d0;
      --muted: #a69d8a;
      --line: rgba(214, 171, 92, 0.28);
      --gold-grad: linear-gradient(180deg, #f6dd9b 0%, #d9ac56 48%, #a67829 100%);
      --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
      --sans: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--sans);
      background:
        radial-gradient(1100px 520px at 85% -8%, rgba(214, 171, 92, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    ::selection { background: rgba(214, 171, 92, 0.35); color: #fff; }

    a { color: var(--gold); text-decoration: none; }
    a:hover { color: var(--gold-light); text-decoration: underline; }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    /* Top Navigation */
    nav {
      background: #050505;
      color: var(--text);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-inner strong {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--gold);
    }

    .nav-inner a { font-weight: 600; color: var(--gold-light); }

    /* Header */
    header {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 45%, rgba(214, 171, 92, 0.16), transparent 52%),
        linear-gradient(135deg, #0a0a0a 0%, #111010 55%, #060606 100%);
      border-bottom: 1px solid var(--line);
      color: var(--text);
    }

    header::before {
      content: "";
      position: absolute;
      right: -150px;
      top: -140px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1px solid rgba(214, 171, 92, 0.38);
      background: radial-gradient(circle at 35% 35%, rgba(214, 171, 92, 0.12), transparent 62%);
      box-shadow: inset 0 0 90px rgba(214, 171, 92, 0.08);
      pointer-events: none;
    }

    header::after {
      content: "";
      position: absolute;
      right: -90px;
      bottom: -90px;
      width: 520px;
      height: 150px;
      border-radius: 50%;
      border-top: 3px solid rgba(214, 171, 92, 0.75);
      transform: rotate(-16deg);
      pointer-events: none;
    }

    .header-inner {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1.12;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      position: relative;
      margin-top: 14px;
      padding-top: 18px;
      font-size: 12.5px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .tagline::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 72px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 48px 20px; }

    p { font-size: 15.5px; color: var(--text); margin: 0 0 12px; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px;
    }

    /* Product cards */
    .card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      border-color: rgba(214, 171, 92, 0.6);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(214, 171, 92, 0.12);
    }

    .card.unavailable { opacity: 0.55; }

    .card h3 {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 8px;
      color: var(--text);
      line-height: 1.4;
      min-height: 44px;
    }

    .price {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      color: var(--gold-light);
      margin: 4px 0 10px;
    }

    .stock {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .buy {
      background: linear-gradient(180deg, #f0d083 0%, #cf9f46 58%, #a77a2b 100%);
      color: #0b0a08;
      border: none;
      padding: 12px 20px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      margin-top: auto;
      box-shadow: 0 6px 18px rgba(214, 171, 92, 0.18);
      transition: filter 0.15s ease;
    }

    .buy:hover { color: #0b0a08; filter: brightness(1.08); text-decoration: none; }

    .buy.disabled {
      background: #1a1916;
      color: #7b7360;
      border: 1px solid rgba(214, 171, 92, 0.15);
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    footer {
      background: #050505;
      color: var(--muted);
      text-align: center;
      padding: 30px 20px;
      font-size: 12.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 600px) {
      .header-inner { padding: 40px 20px; }
      header::before { opacity: 0.55; right: -220px; }
      header::after { opacity: 0.55; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <strong>Jasam Global Trading LLC</strong>
    <span><a href="index.html">Home</a> &nbsp;·&nbsp; Wholesale Import &amp; Export</span>
  </div>
</nav>

<header>
  <div class="header-inner">
    <h1>Shop</h1>
    <div class="tagline">Buy directly from Jasam Global Trading LLC</div>
  </div>
</header>

<main class="container">
  <section>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>© Jasam Global Trading LLC · United States</footer>

<script>
// Each product needs a Stripe Payment Link URL in "buy". Replace the null
// placeholders once the links are created in the Stripe Dashboard — see setup steps.
const PRODUCTS = [
  {t:"ONN Android TV 2K FHD Streaming Stick", p:41.99, stock:10, buy:null},
  {t:"Wiggles & Wags Twists Dog Treats, Chicken & Sweet Potato, 16 oz", p:22.00, stock:1, buy:null},
  {t:"Wiggles & Wags Twists Dog Treats, Beef & Sweet Potato, 16 oz", p:21.75, stock:1, buy:null},
  {t:"Stafford 4 Pack Cotton V-Neck T-Shirts, Big & Tall, White", p:56.99, stock:4, buy:null},
  {t:"MARS MEN Testosterone Booster Supplement, 30 Servings", p:65.00, stock:3, buy:null},
  {t:"GAP Women's Favorite Crewneck Tee, True Black, Medium Tall", p:19.84, stock:5, buy:null},
  {t:"GAP Men's Soft Crewneck Tee, Woodsy Brown, Large", p:20.99, stock:8, buy:null},
  {t:"Juicy Fruit Fruity Chews Sugarfree Gum, 120 pc (3 Pack)", p:44.99, stock:3, buy:null},
];

grid.innerHTML = PRODUCTS.map(p => `
  <div class="card ${p.stock<=0?'unavailable':''}">
    <h3>${p.t}</h3>
    <div class="price">$${p.p.toFixed(2)}</div>
    <div class="stock">${p.stock>0 ? p.stock+" in stock" : "Currently unavailable"}</div>
    ${p.stock>0 && p.buy
      ? `<a class="buy" href="${p.buy}">Buy Now</a>`
      : `<span class="buy disabled">${p.stock>0 ? "Buy link coming soon" : "Sold Out"}</span>`}
  </div>
`).join("");
</script>

</body>
</html>
